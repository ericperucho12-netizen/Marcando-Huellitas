<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Adopción - Marcando Huellitas</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

    <!-- Contenedor del Navbar -->
    <div data-template="../layout/navbar.html" data-root="../.." data-src=".."></div>

    <!-- FORMULARIO DE ADOPCIÓN -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h1 class="text-center fw-bold mb-4">Registro de adopción</h1>
                            <p class="text-center text-muted mb-4">Completa el siguiente formulario para iniciar el proceso de adopción de tu futuro mejor amigo.</p>
                            
                            <form id="adopcionForm" action="https://formspree.io/f/mpqvlkdp" method="POST" novalidate>
                                
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre completo del adoptante</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Correo electrónico</label>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="telefono" class="form-label">Teléfono</label>
                                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="5512345678" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="mascota" class="form-label">¿Qué tipo de mascota deseas adoptar?</label>
                                    <select class="form-select" id="mascota" name="mascota" required>
                                        <option value="" selected disabled>Selecciona una opción</option>
                                        <option value="perro">Perro</option>
                                        <option value="gato">Gato</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="espacio" class="form-label">¿Cuentas con espacio adecuado para la mascota?</label>
                                    <select class="form-select" id="espacio" name="espacio" required>
                                        <option value="" selected disabled>Selecciona una opción</option>
                                        <option value="si">Sí</option>
                                        <option value="no">No</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="razones" class="form-label">¿Por qué deseas adoptar?</label>
                                    <textarea class="form-control" id="razones" name="razones" rows="3" required></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Enviar solicitud de adopción</button>
                                <p id="formStatus" class="mt-3 text-center fw-bold"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor del Footer -->
    <div data-template="../layout/footer.html" data-root="../.." data-src=".."></div>

    <!-- Layout JS -->
    <script src="../scripts/layout.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo JS con la validación personalizada -->
    <script src="../scripts/app.js"></script>
    <!-- Cart Script -->
    <script src="../scripts/cart.js"></script>
</body>

</html>
