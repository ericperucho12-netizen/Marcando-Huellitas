<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Marcando Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .auth-card {
            background-color: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="text-center mb-4">Nueva Contraseña</h2>
            <div id="alertContainer"></div>
            
            <form id="resetForm">
                <div class="mb-3">
                    <label for="password" class="form-label">Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3" style="background-color: #f2b58f; border: none;">Guardar Contraseña</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("resetForm");
            const alertContainer = document.getElementById("alertContainer");
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                alertContainer.innerHTML = '<div class="alert alert-danger">Enlace inválido. Falta el token de seguridad.</div>';
                form.style.display = 'none';
                return;
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const pass = document.getElementById("password").value;
                const confirm = document.getElementById("confirmPassword").value;

                if (pass !== confirm) {
                    alertContainer.innerHTML = '<div class="alert alert-danger">Las contraseñas no coinciden.</div>';
                    return;
                }

                if (pass.length < 8) {
                    alertContainer.innerHTML = '<div class="alert alert-danger">La contraseña debe tener al menos 8 caracteres.</div>';
                    return;
                }

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: token, nuevaPassword: pass })
                    });
                    
                    const text = await response.text();

                    if (response.ok) {
                        Swal.fire({
                            title: '¡Éxito!',
                            text: 'Tu contraseña ha sido actualizada.',
                            icon: 'success'
                        }).then(() => {
                            window.location.href = 'login.html';
                        });
                    } else {
                        alertContainer.innerHTML = `<div class="alert alert-danger">${text}</div>`;
                    }
                } catch (error) {
                    alertContainer.innerHTML = '<div class="alert alert-danger">Error de conexión. Intenta más tarde.</div>';
                }
            });
        });
    </script>
</body>
</html>
