<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando Cuenta... - Marcando Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../styles/global.css" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .auth-card {
            background-color: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 id="statusTitle" class="mb-4">Verificando...</h2>
            <div id="statusMessage" class="alert alert-info">Por favor espera mientras verificamos tu cuenta.</div>
            <div id="spinner" class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <a href="login.html" id="loginBtn" class="btn btn-primary mt-4" style="display: none;">Ir al Login</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const title = document.getElementById("statusTitle");
            const message = document.getElementById("statusMessage");
            const spinner = document.getElementById("spinner");
            const loginBtn = document.getElementById("loginBtn");

            if (!token) {
                title.textContent = "Error";
                message.className = "alert alert-danger";
                message.textContent = "No se proporcionó un token válido.";
                spinner.style.display = "none";
                return;
            }

            try {
                const response = await fetch(`/api/auth/verify?token=${token}`);
                const text = await response.text();
                
                spinner.style.display = "none";
                
                if (response.ok) {
                    title.textContent = "¡Cuenta Verificada!";
                    message.className = "alert alert-success";
                    message.textContent = "Tu cuenta ha sido verificada exitosamente. Ya puedes iniciar sesión.";
                    loginBtn.style.display = "inline-block";
                } else {
                    title.textContent = "Error de Verificación";
                    message.className = "alert alert-danger";
                    message.textContent = text || "El enlace es inválido o ha expirado.";
                }
            } catch (error) {
                spinner.style.display = "none";
                title.textContent = "Error de Conexión";
                message.className = "alert alert-danger";
                message.textContent = "No pudimos conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
