<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Producto - Marcando Huellitas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/styles.css">
    <style>
        .form-card {
            background: #ffffff;
            border-radius: 15px;
            max-width: 800px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .form-control, .form-select, .btn {
            border-radius: 8px !important;
            padding: 12px 16px !important;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <!-- MAIN CONTAINER -->
    <div class="container py-5">
        <div class="mb-4">
            <a href="productos.html" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-2"></i>Volver a la tienda</a>
        </div>
        <section class="form-card shadow-sm mx-auto p-4 p-md-5">
            <div class="form-card__header mb-4 border-bottom pb-3">
                <h2 id="pageTitle" class="fw-bold" style="color: var(--color-text-main);">Agregar Producto</h2>
                <p id="formTitle" class="text-muted">Completa la información para actualizar el catálogo.</p>
            </div>

            <form id="producto-form" novalidate>
                <!-- ---------- Sección: Información General ---------- -->
                <div class="form-section mb-4">
                    <h4 class="form-section__title text-success mb-3 fw-bold"><i class="bi bi-box-seam me-2"></i>Información General</h4>
                    <div class="form-grid row g-3">
                        <div class="form-field col-md-6" data-field="nombre">
                            <label for="nombre-producto" class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" id="nombre-producto" name="nombre" class="form-control" placeholder="Ej. Croquetas premium para perro" required />
                            <span class="field-error text-danger small"></span>
                        </div>
                        <div class="form-field col-md-6" data-field="id">
                            <label for="id-producto" class="form-label fw-bold">ID del Producto (Solo lectura)</label>
                            <input type="text" id="id-producto" name="id" class="form-control" placeholder="Automático" disabled />
                            <span class="field-error text-danger small"></span>
                        </div>
                        <div class="form-field col-md-12" data-field="imagen">
                            <label for="imagen-producto" class="form-label fw-bold">Imagen del producto</label>
                            <div class="image-upload d-flex flex-column gap-2">
                                <label class="btn btn-outline-success btn-sm w-auto" for="imagen-producto" style="max-width: 200px;"><i class="bi bi-image me-2"></i>Cargar Imagen</label>
                                <input type="file" id="imagen-producto" name="imagen" accept="image/*" class="d-none" />
                                <div class="image-upload__preview border rounded p-2 text-center text-muted" id="imagen-preview" style="min-height: 150px; display: flex; align-items: center; justify-content: center; background: #f8f9fa;">
                                    Sin imagen
                                </div>
                            </div>
                        </div>
                        <div class="form-field col-12" data-field="descripcion">
                            <label for="descripcion-producto" class="form-label fw-bold">Descripción Del Producto</label>
                            <textarea id="descripcion-producto" name="descripcion" class="form-control" rows="3" placeholder="Describe el producto..."></textarea>
                            <span class="field-error text-danger small"></span>
                        </div>
                    </div>
                </div>

                <!-- ---------- Sección: Precios y Oferta ---------- -->
                <div class="form-section mb-4">
                    <h4 class="form-section__title text-success mb-3 fw-bold"><i class="bi bi-tag me-2"></i>Precios y Ofertas</h4>
                    <div class="form-grid row g-3">
                        <div class="form-field col-md-6" data-field="precio">
                            <label for="precio" class="form-label fw-bold">Precio Regular (MXN)</label>
                            <input type="number" id="precio" name="precio" class="form-control" min="0" step="any" placeholder="0.00" required />
                            <div class="invalid-feedback">Por favor, ingresa el precio.</div>
                        </div>
                        <div class="form-field col-md-6" data-field="oferta">
                            <label for="producto-oferta" class="form-label fw-bold">¿En oferta?</label>
                            <select id="producto-oferta" name="oferta" class="form-select">
                                <option value="no">No</option>
                                <option value="si">Sí</option>
                            </select>
                        </div>
                        <div class="form-field col-md-12" data-field="precio-oferta">
                            <label for="precio-oferta" class="form-label fw-bold text-success">Precio de Oferta (MXN)</label>
                            <input type="number" id="precio-oferta" name="precio_oferta" class="form-control" min="0" step="any" placeholder="0.00" disabled />
                        </div>
                    </div>
                </div>

                <!-- ---------- Sección: Información Inventario ---------- -->
                <div class="form-section mb-4">
                    <h4 class="form-section__title text-success mb-3 fw-bold"><i class="bi bi-boxes me-2"></i>Clasificación e Inventario</h4>
                    <div class="form-grid row g-3">
                        <div class="form-field col-md-6" data-field="cantidad">
                            <label for="cantidad-inventario" class="form-label fw-bold">Cantidad en inventario</label>
                            <input type="number" id="cantidad-inventario" name="cantidad" class="form-control" min="0" placeholder="0" />
                        </div>
                        <div class="form-field col-md-6" data-field="umbral">
                            <label for="umbral" class="form-label fw-bold">Umbral de pocas existencias</label>
                            <input type="number" id="umbral" name="umbral" class="form-control" min="0" placeholder="0" />
                            <div class="form-text">Cantidad mínima antes de avisar</div>
                        </div>
                        <div class="form-field col-md-6" data-field="especie">
                            <label for="especie" class="form-label fw-bold">Especie</label>
                            <select id="especie" name="especie" class="form-select">
                                <option value="todos">Todos</option>
                                <option value="perros">Perros</option>
                                <option value="gatos">Gatos</option>
                            </select>
                        </div>
                        <div class="form-field col-md-6" data-field="categoria">
                            <label for="categoria" class="form-label fw-bold">Categoría</label>
                            <select id="categoria" name="categoria" class="form-select">
                                <option value="Alimento">Alimento</option>
                                <option value="Accesorios">Accesorios</option>
                                <option value="Descanso">Descanso</option>
                                <option value="Juguetes">Juguetes</option>
                                <option value="Higiene">Higiene</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-3 mt-5 pb-4">
                    <a href="productos.html" class="btn btn-outline-secondary w-50 py-3 fw-bold fs-5">Cancelar</a>
                    <button type="submit" class="btn btn-success w-50 py-3 fw-bold fs-5" style="background:#1f6b3d; border:none;"><i class="bi bi-save me-2"></i>Guardar Producto</button>
                </div>
            </form>
        </section>
    </div>

    <!-- FOOTER -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Toast Exito -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toastExito" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    ¡Producto guardado exitosamente!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Template Loader -->
    <script src="../../scripts/core/layout.js"></script>
    <script src="../../scripts/main.js"></script>
    <!-- Admin JS -->
    <script src="../../scripts/shop/admin-producto.js"></script>
</body>

</html>
