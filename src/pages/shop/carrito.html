<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Marcando Huellitas</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/styles.css">
</head>

<body>
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <main class="cart-page">
        <section class="cart-section">
            <div class="container">
                <div class="row g-4">
                    <div class="col-lg-8">
                        <div class="cart-card">
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                                <h2 class="mb-0">Carrito de Compras</h2>
                                <button type="button" id="btnClearCart" class="btn btn-outline-danger btn-sm">Vaciar carrito</button>
                            </div>

                            <div id="cartEmptyState" class="empty-cart-state" style="display:none;">
                                <i class="bi bi-cart-x"></i>
                                <h3>Tu carrito está vacío</h3>
                                <p>Agrega productos desde la tienda para continuar con tu compra.</p>
                                <a href="../shop/productos.html" class="btn btn-primary btn-shop">Explorar productos</a>
                            </div>

                            <div id="cartItemsContainer" class="cart-items-list"></div>
                        </div>
                    </div>

                    <div class="col-lg-4">
                        <div class="order-summary">
                            <h2>Resumen del pedido</h2>

                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span id="cartSubtotal">$0.00</span>
                            </div>

                            <div class="summary-row">
                                <span>Envío</span>
                                <span id="cartShipping">$0.00</span>
                            </div>

                            <hr>

                            <div class="summary-row total">
                                <span>Total</span>
                                <span id="cartTotal">$0.00</span>
                            </div>

                            <button class="btn-checkout" type="button">
                                Finalizar compra
                            </button>

                            <button class="btn-continue" type="button" onclick="window.location.href="../shop/productos.html"">
                                Seguir comprando
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <script src="../../scripts/core/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cart Script -->
    <script src="../../scripts/shop/cart.js"></script>
    <script src="../../scripts/main.js"></script>
</body>

</html>
