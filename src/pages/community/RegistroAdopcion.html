<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Adopción - Marcando Huellitas</title>

    <script>
        if (!sessionStorage.getItem("usuarioActual")) {
            alert("Debes iniciar sesión para adoptar una mascota.");
            window.location.href = "../auth/login.html";
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../styles/styles.css">
    <!-- Loader Script -->
    <script src="../../scripts/core/loader.js"></script>

    <style>
        body {
            background-color: #f7f9fa;
        }
        .registro-modal-container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }
        .registro-header {
            background: linear-gradient(135deg, #fdf8c3 0%, #ffe3d8 100%);
            padding: 40px;
            position: relative;
        }
        .badge-huellitas {
            background-color: #fce2e8;
            color: #d14981;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
        }
        .registro-title {
            font-family: 'DynaPuff', cursive;
            color: #ff69b4;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .registro-subtitle {
            color: #6b5247;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            font-size: 1rem;
        }
        .registro-body {
            padding: 40px;
            background: #ffffff;
        }
        .form-label {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #6b5247;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border: 1px solid #f2b58f;
            border-radius: 12px;
            padding: 12px 15px;
            font-family: 'Nunito', sans-serif;
            color: #4a4a4a;
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(242, 181, 143, 0.25);
            border-color: #ff69b4;
        }
        .btn-submit {
            background-color: #ff69b4;
            border: none;
            color: #ffffff;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #e55a9e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4);
        }
    </style>
</head>

<body>

    <!-- Contenedor del Navbar -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <!-- FORMULARIO DE ADOPCIÓN -->
    <div class="registro-modal-container">
        <!-- Encabezado con degradado -->
        <div class="registro-header text-center">
            <span class="badge-huellitas">Adopciones</span>
            <h1 class="registro-title">Registro de adopción</h1>
            <p class="registro-subtitle mb-0">Completa el siguiente formulario para iniciar el proceso de adopción de tu futuro mejor amigo o amiga.</p>
        </div>

        <div class="registro-body">
            <form id="adopcionForm" novalidate>
                
                <div class="mb-3 form-field" data-field="nombre">
                    <label for="nombre" class="form-label">Nombre completo del adoptante</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                    <span class="field-error"></span>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3 form-field" data-field="email">
                        <label for="email" class="form-label">Correo electronico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                        <span class="field-error"></span>
                    </div>
                    <div class="col-md-6 mb-3 form-field" data-field="telefono">
                        <label for="telefono" class="form-label">Telefono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="5512345678" required>
                        <span class="field-error"></span>
                    </div>
                </div>

                <div class="mb-3 form-field" data-field="mascotaId">
                    <label for="mascotaId" class="form-label">Mascota que deseas adoptar</label>
                    <select class="form-select" id="mascotaId" name="mascotaId" required>
                        <option value="" selected disabled>Cargando mascotas...</option>
                    </select>
                    <span class="field-error"></span>
                </div>

                <div class="mb-3 form-field" data-field="espacio">
                    <label for="espacio" class="form-label">¿Cuentas con espacio adecuado para la mascota?</label>
                    <select class="form-select" id="espacio" name="espacio" required>
                        <option value="" selected disabled>Selecciona una opcion</option>
                        <option value="si">Si</option>
                        <option value="no">No</option>
                    </select>
                    <span class="field-error"></span>
                </div>

                <div class="mb-3 form-field" data-field="fechaCita">
                    <label for="fechaCita" class="form-label">Fecha y hora para sacar cita (Lunes a Viernes de 9:00 am a 6:00 pm)</label>
                    <input type="datetime-local" class="form-control" id="fechaCita" name="fechaCita" required>
                    <span class="field-error"></span>
                </div>

                <div class="mb-4 form-field" data-field="razones">
                    <label for="razones" class="form-label">¿Por qué deseas adoptar?</label>
                    <textarea class="form-control" id="razones" name="razones" rows="3" required></textarea>
                    <span class="field-error"></span>
                </div>

                <div id="alertaExito" class="alert alert-success alert-dismissible fade d-none mb-3" role="alert">
                    Se ha registrado con éxito
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <button type="submit" class="btn-submit mt-4">
                    <i class="fa-solid fa-paper-plane"></i> Enviar solicitud de adopción
                </button>
                <p id="formStatus" class="mt-3 text-center fw-bold"></p>
            </form>
        </div>
    </div>

    <!-- TOAST DECORATIVO -->
    <div class="toast" id="toast">
        <div class="toast__icon"></div>
        <div>
            <div class="toast__title fw-bold">¡Solicitud enviada!</div>
            <div class="toast__message text-muted">Tu registro se envio con exito.</div>
        </div>
    </div>

    <!-- Contenedor del Footer -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Bundler JS -->
    <script src="../../scripts/main.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cart Script -->
    <script src="../../scripts/shop/cart.js"></script>

    <!-- Script de validación -->
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById("adopcionForm");
      if (!form) return;

      const requiredFieldNames = ["nombre", "email", "telefono", "mascotaId", "espacio", "fechaCita", "razones"];
      const toast = document.getElementById("toast");

      // Cargar mascotas
      try {
          const res = await fetch('/api/mascotas');
          const mascotas = await res.json();
          const selectMascota = document.getElementById('mascotaId');
          selectMascota.innerHTML = '<option value="" selected disabled>Selecciona una mascota</option>';
          mascotas.forEach(m => {
              const option = document.createElement('option');
              option.value = m.id;
              option.textContent = `${m.nombre} (${m.especie || 'Mascota'})`;
              selectMascota.appendChild(option);
          });
      } catch (e) {
          console.error("Error al cargar mascotas", e);
      }

      function getFieldWrapper(name) {
        return form.querySelector(`[name="${name}"]`)?.closest(".form-field");
      }

      function setFieldError(wrapper, message) {
        if (!wrapper) return;
        wrapper.classList.add("is-invalid");
        const errorEl = wrapper.querySelector(".field-error");
        if (errorEl) errorEl.textContent = message;
      }

      function clearFieldError(wrapper) {
        if (!wrapper) return;
        wrapper.classList.remove("is-invalid");
        const errorEl = wrapper.querySelector(".field-error");
        if (errorEl) errorEl.textContent = "";
      }

      function validateField(name) {
        const input = form.querySelector(`[name="${name}"]`);
        const wrapper = getFieldWrapper(name);
        if (!input || !wrapper) return true;

        const value = input.value.trim();

        if (!value) {
          setFieldError(wrapper, "Este campo es obligatorio.");
          return false;
        }

        if (name === "email") {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(value)) {
            setFieldError(wrapper, "Por favor ingresa un correo electrónico válido.");
            return false;
          }
        }

        if (name === "telefono") {
          const phoneRegex = /^\d{10}$/;
          if (!phoneRegex.test(value.replace(/\D/g, ''))) {
            setFieldError(wrapper, "Ingresa un número de teléfono válido de 10 dígitos.");
            return false;
          }
        }

        if (name === "fechaCita") {
          const fechaSeleccionada = new Date(value);
          const diaSemana = fechaSeleccionada.getDay(); 
          const hora = fechaSeleccionada.getHours();

          // Validar que sea de Lunes a Viernes
          if (diaSemana === 0 || diaSemana === 6) {
            setFieldError(wrapper, "Las citas solo están disponibles de lunes a viernes.");
            return false;
          }

          // Validar horario de 9 am a 6 pm (18:00)
          if (hora < 9 || hora >= 18) {
            setFieldError(wrapper, "El horario de atención es de 9:00 am a 6:00 pm.");
            return false;
          }
        }

        clearFieldError(wrapper);
        return true;
      }

      function validateForm() {
        let isValid = true;
        requiredFieldNames.forEach((name) => {
          const fieldIsValid = validateField(name);
          if (!fieldIsValid) isValid = false;
        });
        return isValid;
      }

      requiredFieldNames.forEach((name) => {
        const input = form.querySelector(`[name="${name}"]`);
        if (!input) return;
        input.addEventListener("input", () => validateField(name));
        input.addEventListener("blur", () => validateField(name));
        if (input.tagName === "SELECT" || input.type === "datetime-local") {
          input.addEventListener("change", () => validateField(name));
        }
      });

      let toastTimeout;
      function showToast({ title, message, isError = false } = {}) {
        if (!toast) return;

        if (title) toast.querySelector(".toast__title").textContent = title;
        if (message) toast.querySelector(".toast__message").textContent = message;
        toast.querySelector(".toast__icon").textContent = isError ? "" : "";

        toast.classList.add("toast--visible");
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove("toast--visible");
        }, 3200);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (window.requireAuth && !window.requireAuth('enviar una solicitud de adopción')) return;

        const isValid = validateForm();

        if (!isValid) {
          showToast({
            title: "Faltan datos",
            message: "Por favor corrige los errores indicados en el formulario.",
            isError: true,
          });

          const firstInvalid = form.querySelector(".is-invalid input, .is-invalid select, .is-invalid textarea");
          if (firstInvalid) firstInvalid.focus();
          return;
        }

        const formData = new FormData(form);
        const usuarioActual = JSON.parse(sessionStorage.getItem("usuarioActual"));
        
        const payload = {
            usuarioId: usuarioActual ? usuarioActual.id : null,
            mascotaId: parseInt(formData.get("mascotaId")),
            telefono: formData.get("telefono"),
            direccion: formData.get("espacio"),
            experiencia: formData.get("razones"),
            fechaCita: formData.get("fechaCita"),
            estado: "Pendiente"
        };

        try {
            const response = await fetch('/api/solicitudes_adopcion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Error al enviar solicitud");

            const alertaExito = document.getElementById("alertaExito");
            if (alertaExito) {
                alertaExito.classList.remove("d-none");
                alertaExito.classList.add("show");
            }

            setTimeout(() => {
                window.location.href = "adpciones.html";
            }, 2000);
            
        } catch (error) {
            console.error(error);
            showToast({
                title: "Error",
                message: "Hubo un problema al guardar la solicitud.",
                isError: true,
            });
        }
      });
    });
    </script>
    <!-- Layout -->
    <script src="../../scripts/core/layout.js"></script>

    <!-- Script para pre-llenar formulario en modo edición -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const editId = params.get('editId');
        if (!editId) return;

        const data = JSON.parse(sessionStorage.getItem('editarAdopcion'));
        if (!data) return;

        // Cambiar título y botón al modo edición
        const titulo = document.querySelector('h1');
        if (titulo) titulo.textContent = 'Editar Solicitud de Adopción';
        const submitBtn = document.querySelector('button[type="submit"]');
        if (submitBtn) submitBtn.textContent = 'Guardar Cambios';

        // Esperar a que carguen las mascotas y pre-llenar los campos
        const esperarMascotas = setInterval(() => {
            const selectMascota = document.getElementById('mascotaId');
            if (selectMascota && selectMascota.options.length > 1) {
                clearInterval(esperarMascotas);

                document.getElementById('telefono').value = data.telefono || '';
                document.getElementById('espacio').value = data.direccion || '';
                document.getElementById('razones').value = data.experiencia || '';

                if (data.fechaCita) {
                    document.getElementById('fechaCita').value = data.fechaCita.substring(0, 16);
                }
                selectMascota.value = data.mascotaId || '';
            }
        }, 200);

        // Interceptar el submit para hacer PUT en vez de POST
        const form = document.getElementById('adopcionForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                e.stopImmediatePropagation();

                const payload = {
                    ...data,
                    telefono: document.getElementById('telefono').value,
                    direccion: document.getElementById('espacio').value,
                    experiencia: document.getElementById('razones').value,
                    fechaCita: document.getElementById('fechaCita').value,
                    mascotaId: parseInt(document.getElementById('mascotaId').value)
                };

                try {
                    const response = await fetch(`/api/solicitudes_adopcion/${editId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        sessionStorage.removeItem('editarAdopcion');
                        alert('¡Solicitud actualizada correctamente!');
                        window.history.back();
                    } else {
                        alert('Error al actualizar la solicitud.');
                    }
                } catch (err) {
                    alert('Error de conexión.');
                }
            }, true); // capture=true para ejecutarse antes del listener de validación
        }
    });
    </script>
</body>

</html>
