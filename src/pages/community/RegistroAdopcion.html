<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Adopción - Marcando Huellitas</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../styles/styles.css">
    <!-- Loader Script -->
    <script src="../../scripts/core/loader.js"></script>

</head>

<body>

    <!-- Contenedor del Navbar -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <!-- FORMULARIO DE ADOPCIÓN -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h1 class="text-center fw-bold mb-4">Registro de adopción</h1>
                            <p class="text-center text-muted mb-4">Completa el siguiente formulario para iniciar el proceso de adopcion de tu futuro mejor amigo o amiga.</p>
                            
                            <form id="adopcionForm" action="https://formspree.io/f/mpqvlkdp" method="POST" novalidate>
                                
                                <div class="mb-3 form-field" data-field="nombre">
                                    <label for="nombre" class="form-label">Nombre completo del adoptante</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                                    <span class="field-error"></span>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3 form-field" data-field="email">
                                        <label for="email" class="form-label">Correo electronico</label>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                        <span class="field-error"></span>
                                    </div>
                                    <div class="col-md-6 mb-3 form-field" data-field="telefono">
                                        <label for="telefono" class="form-label">Telefono</label>
                                        <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="5512345678" required>
                                        <span class="field-error"></span>
                                    </div>
                                </div>

                                <div class="mb-3 form-field" data-field="nombreMascota">
                                    <label for="nombreMascota" class="form-label">Nombre del animalito que se quiere adoptar</label>
                                    <input type="text" class="form-control" id="nombreMascota" name="nombreMascota" placeholder="Ej. Firulais o Mochi" required>
                                    <span class="field-error"></span>
                                </div>

                                <div class="mb-3 form-field" data-field="mascota">
                                    <label for="mascota" class="form-label">¿Que tipo de mascota deseas adoptar?</label>
                                    <select class="form-select" id="mascota" name="mascota" required>
                                        <option value="" selected disabled>Selecciona una opcion</option>
                                        <option value="perro">Perro</option>
                                        <option value="gato">Gato</option>
                                    </select>
                                    <span class="field-error"></span>
                                </div>

                                <div class="mb-3 form-field" data-field="espacio">
                                    <label for="espacio" class="form-label">¿Cuentas con espacio adecuado para la mascota?</label>
                                    <select class="form-select" id="espacio" name="espacio" required>
                                        <option value="" selected disabled>Selecciona una opcion</option>
                                        <option value="si">Si</option>
                                        <option value="no">No</option>
                                    </select>
                                    <span class="field-error"></span>
                                </div>

                                <div class="mb-3 form-field" data-field="fechaCita">
                                    <label for="fechaCita" class="form-label">Fecha y hora para sacar cita (Lunes a Viernes de 9:00 am a 6:00 pm)</label>
                                    <input type="datetime-local" class="form-control" id="fechaCita" name="fechaCita" required>
                                    <span class="field-error"></span>
                                </div>

                                <div class="mb-4 form-field" data-field="razones">
                                    <label for="razones" class="form-label">¿Por que deseas adoptar?</label>
                                    <textarea class="form-control" id="razones" name="razones" rows="3" required></textarea>
                                    <span class="field-error"></span>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Enviar solicitud de adopcion</button>
                                <p id="formStatus" class="mt-3 text-center fw-bold"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- TOAST DECORATIVO -->
    <div class="toast" id="toast">
        <div class="toast__icon">✅</div>
        <div>
            <div class="toast__title fw-bold">¡Solicitud enviada!</div>
            <div class="toast__message text-muted">Tu registro se envio con exito.</div>
        </div>
    </div>

    <!-- Contenedor del Footer -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Bundler JS -->
    <script src="../../scripts/main.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Cart Script -->
    <script src="../../scripts/shop/cart.js"></script>

    <!-- Script de validación -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("adopcionForm");
      if (!form) return;

      const requiredFieldNames = ["nombre", "email", "telefono", "nombreMascota", "mascota", "espacio", "fechaCita", "razones"];
      const toast = document.getElementById("toast");

      function getFieldWrapper(name) {
        return form.querySelector(`[name="${name}"]`)?.closest(".form-field");
      }

      function setFieldError(wrapper, message) {
        if (!wrapper) return;
        wrapper.classList.add("is-invalid");
        const errorEl = wrapper.querySelector(".field-error");
        if (errorEl) errorEl.textContent = message;
      }

      function clearFieldError(wrapper) {
        if (!wrapper) return;
        wrapper.classList.remove("is-invalid");
        const errorEl = wrapper.querySelector(".field-error");
        if (errorEl) errorEl.textContent = "";
      }

      function validateField(name) {
        const input = form.querySelector(`[name="${name}"]`);
        const wrapper = getFieldWrapper(name);
        if (!input || !wrapper) return true;

        const value = input.value.trim();

        if (!value) {
          setFieldError(wrapper, "Este campo es obligatorio.");
          return false;
        }

        if (name === "email") {
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(value)) {
            setFieldError(wrapper, "Por favor ingresa un correo electrónico válido.");
            return false;
          }
        }

        if (name === "telefono") {
          const phoneRegex = /^\d{10}$/;
          if (!phoneRegex.test(value.replace(/\D/g, ''))) {
            setFieldError(wrapper, "Ingresa un número de teléfono válido de 10 dígitos.");
            return false;
          }
        }

        if (name === "fechaCita") {
          const fechaSeleccionada = new Date(value);
          const diaSemana = fechaSeleccionada.getDay(); 
          const hora = fechaSeleccionada.getHours();

          // Validar que sea de Lunes a Viernes
          if (diaSemana === 0 || diaSemana === 6) {
            setFieldError(wrapper, "Las citas solo están disponibles de lunes a viernes.");
            return false;
          }

          // Validar horario de 9 am a 6 pm (18:00)
          if (hora < 9 || hora >= 18) {
            setFieldError(wrapper, "El horario de atención es de 9:00 am a 6:00 pm.");
            return false;
          }
        }

        clearFieldError(wrapper);
        return true;
      }

      function validateForm() {
        let isValid = true;
        requiredFieldNames.forEach((name) => {
          const fieldIsValid = validateField(name);
          if (!fieldIsValid) isValid = false;
        });
        return isValid;
      }

      requiredFieldNames.forEach((name) => {
        const input = form.querySelector(`[name="${name}"]`);
        if (!input) return;
        input.addEventListener("input", () => validateField(name));
        input.addEventListener("blur", () => validateField(name));
        if (input.tagName === "SELECT" || input.type === "datetime-local") {
          input.addEventListener("change", () => validateField(name));
        }
      });

      let toastTimeout;
      function showToast({ title, message, isError = false } = {}) {
        if (!toast) return;

        if (title) toast.querySelector(".toast__title").textContent = title;
        if (message) toast.querySelector(".toast__message").textContent = message;
        toast.querySelector(".toast__icon").textContent = isError ? "⚠️" : "✅";

        toast.classList.add("toast--visible");
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove("toast--visible");
        }, 3200);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const isValid = validateForm();

        if (!isValid) {
          showToast({
            title: "Faltan datos",
            message: "Por favor corrige los errores indicados en el formulario.",
            isError: true,
          });

          const firstInvalid = form.querySelector(".is-invalid input, .is-invalid select, .is-invalid textarea");
          if (firstInvalid) firstInvalid.focus();
          return;
        }

        showToast({
          title: "¡Solicitud guardada!",
          message: "Tu registro de adopción y cita se enviaron con éxito.",
        });

        const formData = new FormData(form);
        const dataObj = Object.fromEntries(formData.entries());

        form.dispatchEvent(new CustomEvent("formularioValido", {
          detail: dataObj
        }));

        setTimeout(() => {
          form.submit();
        }, 1500);
      });
    });
    </script>
</body>

</html>
