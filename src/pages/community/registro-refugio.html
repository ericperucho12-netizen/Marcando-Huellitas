<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Refugio - Marcando Huellitas</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../../styles/styles.css">

    <style>
        body {
            background-color: #f7f9fa;
        }

        .registro-modal-container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }

        .registro-header {
            background: linear-gradient(135deg, #fdf8c3 0%, #ffe3d8 100%);
            padding: 40px;
            position: relative;
        }

        .btn-close-custom {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #6b5247;
            cursor: pointer;
            text-decoration: none;
        }

        .badge-huellitas {
            background-color: #fce2e8;
            color: #d14981;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
        }

        .registro-title {
            font-family: 'DynaPuff', cursive;
            color: #ff69b4;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .registro-subtitle {
            color: #6b5247;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            font-size: 1rem;
        }

        .registro-body {
            padding: 40px;
            background: #ffffff;
        }

        .form-label {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #6b5247;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-label span.required {
            color: #ff69b4;
        }

        .form-control, .form-select {
            border: 1px solid #f2b58f;
            border-radius: 12px;
            padding: 12px 15px;
            font-family: 'Nunito', sans-serif;
            color: #4a4a4a;
            background-color: #ffffff;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(242, 181, 143, 0.25);
            border-color: #ff69b4;
        }

        .form-control::placeholder {
            color: #b5aba6;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #f2b58f;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
        }

        .file-upload-btn {
            background-color: #fcebe2;
            color: #6b5247;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            border-right: 1px solid #f2b58f;
        }

        .file-upload-text {
            padding: 12px 15px;
            color: #b5aba6;
            font-family: 'Nunito', sans-serif;
            flex-grow: 1;
        }

        .confirmation-box {
            background-color: #fdf8c3;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
        }

        .confirmation-box input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #ff69b4;
            cursor: pointer;
        }

        .confirmation-box label {
            font-family: 'Nunito', sans-serif;
            color: #6b5247;
            font-weight: 600;
            margin: 0;
            cursor: pointer;
        }

        .registro-footer {
            background-color: #fdf8c3;
            padding: 25px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            border-top: 1px dashed #f2b58f;
        }

        .btn-cancel {
            background-color: transparent;
            border: 2px solid #e5dbb0;
            color: #6b5247;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background-color: #e5dbb0;
        }

        .btn-submit {
            background-color: #ff69b4;
            border: none;
            color: #ffffff;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #e55a9e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4);
        }

        .helper-text {
            font-size: 0.75rem;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>

<body data-page="Refugios">

    <!-- Contenedor del Navbar -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <div class="container pb-5">
        <div class="registro-modal-container">
            <!-- HEADER -->
            <div class="registro-header">
                <a href="Refugios.html" class="btn-close-custom" title="Cerrar"><i class="bi bi-x-lg"></i></a>
                <span class="badge-huellitas">Marcando Huellitas</span>
                <h1 class="registro-title">Registrar asociación o refugio</h1>
                <p class="registro-subtitle">Completa la información para enviar tu solicitud.</p>
            </div>

            <!-- CUERPO DEL FORMULARIO -->
            <div class="registro-body">
                <form id="registroRefugioForm" action="#">
                    
                    <div class="row g-4 mb-3">
                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label class="form-label">Nombre de la asociación <span class="required">*</span></label>
                            <input type="text" class="form-control" placeholder="Ej. La Casa de Crispín" required>
                        </div>
                        <!-- Responsable -->
                        <div class="col-md-6">
                            <label class="form-label">Persona responsable <span class="required">*</span></label>
                            <input type="text" class="form-control" placeholder="Nombre completo" required>
                        </div>
                    </div>

                    <div class="row g-4 mb-3">
                        <!-- Correo -->
                        <div class="col-md-6">
                            <label class="form-label">Correo electrónico <span class="required">*</span></label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                        <!-- Teléfono -->
                        <div class="col-md-6">
                            <label class="form-label">Teléfono <span class="required">*</span></label>
                            <input type="tel" class="form-control" placeholder="55 1234 5678" required>
                        </div>
                    </div>

                    <div class="mb-3 mt-4">
                        <label class="form-label">Dirección <span class="required">*</span></label>
                        <input type="text" class="form-control" placeholder="Calle, número, colonia y municipio" required>
                    </div>

                    <div class="row g-4 mb-3">
                        <!-- Estado -->
                        <div class="col-md-6">
                            <label class="form-label">Estado / Entidad <span class="required">*</span></label>
                            <input type="text" class="form-control" placeholder="Ej. Nuevo León" required>
                        </div>
                        <!-- Tipo Organización -->
                        <div class="col-md-6">
                            <label class="form-label">Tipo de organización <span class="required">*</span></label>
                            <select class="form-select" required>
                                <option value="" disabled selected>Selecciona una opción</option>
                                <option value="refugio">Refugio / Albergue</option>
                                <option value="asociacion">Asociación Civil</option>
                                <option value="rescatista">Rescatista Independiente</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3 mt-4">
                        <label class="form-label">Descripción <span class="required">*</span></label>
                        <textarea class="form-control" rows="4" placeholder="Cuéntanos brevemente sobre la organización y su labor." maxlength="300" required></textarea>
                        <div class="helper-text">Máximo 300 caracteres.</div>
                    </div>

                    <div class="row g-4 mb-3 mt-1">
                        <!-- Sitio web -->
                        <div class="col-md-6">
                            <label class="form-label">Sitio web</label>
                            <input type="url" class="form-control" placeholder="https://...">
                        </div>
                        <!-- Instagram -->
                        <div class="col-md-6">
                            <label class="form-label">Instagram</label>
                            <input type="text" class="form-control" placeholder="@usuario">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Facebook</label>
                        <input type="text" class="form-control" placeholder="Nombre o enlace de Facebook">
                    </div>

                    <!-- Archivo -->
                    <div class="mb-2 mt-4">
                        <label class="form-label">Logo o imagen de la organización</label>
                        <div class="file-upload-wrapper">
                            <button type="button" class="file-upload-btn" onclick="document.getElementById('fileUpload').click()">Elegir archivo</button>
                            <div class="file-upload-text" id="fileName">No se eligió ningún archivo</div>
                            <input type="file" id="fileUpload" style="display: none;" accept=".jpg, .jpeg, .png, .webp" onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : 'No se eligió ningún archivo'">
                        </div>
                        <div class="helper-text">Formatos permitidos: JPG, PNG o WEBP.</div>
                    </div>

                    <!-- Checkbox confirmación -->
                    <div class="confirmation-box">
                        <input type="checkbox" id="confirmData" required>
                        <label for="confirmData">Confirmo que la información proporcionada es correcta.</label>
                    </div>

                </form>
            </div>

            <!-- FOOTER CON BOTONES -->
            <div class="registro-footer">
                <a href="Refugios.html" class="btn btn-cancel text-decoration-none">Cancelar</a>
                <button type="submit" form="registroRefugioForm" class="btn btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Enviar solicitud
                </button>
            </div>

        </div>
    </div>

    <!-- Contenedor del Footer -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Scripts -->
    <script src="../../scripts/main.js"></script>
    <script src="../../scripts/core/store.js"></script>
    <script src="../../scripts/core/layout.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
