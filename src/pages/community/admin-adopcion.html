<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Mascota - Marcando Huellitas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/styles.css">
    <style>
        body {
            background-color: #f7f9fa;
        }
        .registro-modal-container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }
        .registro-header {
            background: linear-gradient(135deg, #fdf8c3 0%, #ffe3d8 100%);
            padding: 40px;
            position: relative;
        }
        .badge-huellitas {
            background-color: #fce2e8;
            color: #d14981;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
        }
        .registro-title {
            font-family: 'DynaPuff', cursive;
            color: #ff69b4;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .registro-subtitle {
            color: #6b5247;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            font-size: 1rem;
        }
        .registro-body {
            padding: 40px;
            background: #ffffff;
        }
        .form-label {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #6b5247;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border: 1px solid #f2b58f;
            border-radius: 12px;
            padding: 12px 15px;
            font-family: 'Nunito', sans-serif;
            color: #4a4a4a;
            background-color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(242, 181, 143, 0.25);
            border-color: #ff69b4;
        }
        .btn-submit {
            background-color: #ff69b4;
            border: none;
            color: #ffffff;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background-color: #e55a9e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4);
        }
        .btn-cancel {
            background-color: transparent;
            border: 2px solid #e5dbb0;
            color: #6b5247;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-cancel:hover {
            background-color: #e5dbb0;
            color: #6b5247;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <!-- MAIN CONTAINER -->
    <div class="registro-modal-container">
        <!-- Encabezado -->
        <div class="registro-header text-center">
            <span class="badge-huellitas">Adopciones Admin</span>
            <h2 id="pageTitle" class="registro-title">Agregar Mascota</h2>
            <p class="registro-subtitle mb-0">Completa la información para agregar una mascota a la lista de adopciones.</p>
        </div>

        <div class="registro-body">
            <form id="adopcion-form" novalidate>
                <div class="form-section">
                    <div class="form-grid row g-3">
                        <div class="form-field col-md-6" data-field="nombre">
                            <label class="form-label fw-bold" for="nombre-mascota">Nombre</label>
                            <input type="text" class="form-control" id="nombre-mascota" name="nombre" placeholder="Ej. Firulais" required />
                            <span class="field-error text-danger small"></span>
                        </div>
                        <div class="form-field col-md-6" data-field="id">
                            <label class="form-label fw-bold" for="id-mascota">ID (Solo lectura)</label>
                            <input type="text" class="form-control" id="id-mascota" name="id" placeholder="Automático" disabled />
                            <span class="field-error"></span>
                        </div>
                        <div class="form-field col-md-6" data-field="especie">
                            <label class="form-label fw-bold" for="especie">Especie</label>
                            <select class="form-select" id="especie" name="especie">
                                <option value="perro">Perro</option>
                                <option value="gato">Gato</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-field col-md-6" data-field="raza">
                            <label class="form-label fw-bold" for="raza">Raza</label>
                            <input type="text" class="form-control" id="raza" name="raza" placeholder="Ej. Labrador Mix" />
                        </div>
                        <div class="form-field col-md-6" data-field="sexo">
                            <label class="form-label fw-bold" for="sexo">Sexo</label>
                            <select class="form-select" id="sexo" name="sexo">
                                <option value="macho">Macho</option>
                                <option value="hembra">Hembra</option>
                            </select>
                        </div>
                        <div class="form-field col-md-6" data-field="tamano">
                            <label class="form-label fw-bold" for="tamano">Tamaño</label>
                            <select class="form-select" id="tamano" name="tamano">
                                <option value="Pequeño">Pequeño</option>
                                <option value="Mediano">Mediano</option>
                                <option value="Grande">Grande</option>
                            </select>
                        </div>
                        <div class="form-field col-md-6" data-field="edad">
                            <label class="form-label fw-bold" for="edad">Edad</label>
                            <input type="text" class="form-control" id="edad" name="edad" placeholder="Ej. 2 años" />
                        </div>
                        <div class="form-field col-md-6" data-field="estado">
                            <label class="form-label fw-bold" for="estado">Estado</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="Disponible">Disponible</option>
                                <option value="En Proceso">En Proceso</option>
                                <option value="Urgente">Urgente</option>
                            </select>
                        </div>

                        <div class="form-field col-md-12" data-field="imagen">
                            <label class="form-label fw-bold" for="imagen-mascota">Imagen (URL provisional)</label>
                            <input type="text" id="imagen-mascota" name="imagenUrl" class="form-control" placeholder="https://..." />
                        </div>

                        <div class="form-field col-12" data-field="descripcion">
                            <label class="form-label fw-bold" for="descripcion-mascota">Descripción General</label>
                            <textarea class="form-control" id="descripcion-mascota" name="descripcion" placeholder="Cuéntanos sobre esta mascota..." rows="3"></textarea>
                        </div>

                        <div class="form-field col-12" data-field="caracteristicas">
                            <label class="form-label fw-bold" for="caracteristicas">Características Extra (Separadas por comas)</label>
                            <input type="text" class="form-control" id="caracteristicas" name="caracteristicas" placeholder="Ej. Vacunado, Tranquilo, Esterilizado" />
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-3 mt-4 pt-4 border-top">
                    <a href="adpciones.html" class="btn-cancel w-50 py-3 fw-bold fs-5">Cancelar</a>
                    <button type="submit" class="btn-submit w-50 py-3 fw-bold fs-5"><i class="bi bi-save me-2"></i>Guardar Mascota</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Toast Exito -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toastExito" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    ¡Mascota guardada exitosamente!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Template Loader -->
    <script src="../../scripts/core/layout.js"></script>
    <script src="../../scripts/main.js"></script>
    <!-- Admin JS -->
    <script src="../../scripts/community/admin-adopcion.js"></script>
</body>

</html>
