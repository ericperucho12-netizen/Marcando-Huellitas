<section class="form-card">
      <div class="form-card__header">
        <h1>Perfil de adopción</h1>
        <p>Información General</p>
      </div>

      <form id="adopcion-form" novalidate>

        <div class="form-section">
          <h2 class="form-section__title">Información General</h2>

          <div class="form-grid">

            <div class="form-field" data-field="nombre">
              <label for="nombre-mascota">Nombre</label>
              <input type="text" id="nombre-mascota" name="nombre" placeholder="Ej. Firulais" required />
              <span class="field-error"></span>
            </div>

            <div class="form-field" data-field="imagen">
              <label for="imagen-mascota">Imagen</label>
              <div class="image-upload">
                <label class="image-upload__trigger" for="imagen-mascota">+ Agregar Imagen</label>
                <input type="file" id="imagen-mascota" name="imagen" accept="image/*" />
                <div class="image-upload__preview" id="imagen-preview">Sin imagen</div>
              </div>
            </div>

            <div class="form-field form-field--full" data-field="descripcion">
              <label for="descripcion-mascota">Descripción General</label>
              <textarea id="descripcion-mascota" name="descripcion" placeholder="Cuéntanos sobre esta mascota..."></textarea>
            </div>

            <div class="form-field" data-field="edad">
              <label for="edad">Edad</label>
              <input type="text" id="edad" name="edad" placeholder="Ej. 2 años" />
            </div>

            <div class="form-field" data-field="vacunado">
              <label for="vacunado">Vacunado</label>
              <select id="vacunado" name="vacunado">
                <option value="">Seleccione respuesta</option>
                <option value="si">Sí</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-field" data-field="enfermedad">
              <label for="enfermedad">Alguna Enfermedad</label>
              <select id="enfermedad" name="enfermedad">
                <option value="">Seleccione respuesta</option>
                <option value="ninguna">Ninguna</option>
                <option value="si">Sí</option>
              </select>
            </div>

            <div class="form-field" data-field="id">
              <label for="id-mascota">ID</label>
              <input type="text" id="id-mascota" name="id" placeholder="Ej. ADP-0001" required />
              <span class="field-error"></span>
            </div>

            <div class="form-field" data-field="refugio">
              <label for="refugio">Lugar de refugio</label>
              <input type="text" id="refugio" name="refugio" placeholder="Ej. Refugio Patitas Felices" />
            </div>

          </div>
        </div>

        <!-- ---------- Botones de acción ---------- -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <button type="reset" class="btn btn-secondary" id="cancelar-btn">Cancelar</button>
        </div>

      </form>
    </section>
    </main>

    <!-- TOAST DECORATIVO -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastExito" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-check-circle-fill me-2"></i> Producto guardado correctamente.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Contenedor del Footer -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/core/layout.js"></script>
    
    <!-- Script de Admin -->
    <script src="../../scripts/shop/adminForms.js"></script>
</body>
</html>
