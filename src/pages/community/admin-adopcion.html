<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Adopción - Marcando Huellitas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles/styles.css">
    <style>
        .form-card {
            background: #ffffff;
            border-radius: 15px;
            max-width: 800px;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .page-header {
            background: linear-gradient(135deg, #1f6b3d 0%, #2e9a58 100%);
            padding: 40px 0;
            text-align: center;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .btn-back {
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .btn-back:hover {
            color: #d1f2e0;
        }
        /* Override pill-shape para esta página */
        .form-control, .form-select, .btn {
            border-radius: 8px !important;
            padding: 12px 16px !important;
        }
    </style>
    
    <!-- Protección de Ruta Admin -->
    <script>
        (function() {
            const userStr = sessionStorage.getItem("usuarioActual");
            if (!userStr) {
                window.location.href = "../auth/login.html";
                return;
            }
            const user = JSON.parse(userStr);
            if (user.rol !== "admin" && user.email !== "admin@marcandohuellitas.com") {
                window.location.href = "../../index.html";
            }
        })();
    </script>
    <!-- Loader Script -->
    <script src="../../scripts/core/loader.js"></script>
</head>
<body class="bg-light">
    <!-- Contenedor del NavBar -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <div class="page-header shadow-sm">
        <div class="container">
            <a href="../community/adpciones.html" class="btn-back"><i class="bi bi-arrow-left"></i> Volver a Adopciones</a>
            <h1 id="pageTitle" style="font-family:var(--font-titles);font-weight:700;">Nueva Mascota</h1>
        </div>
    </div>

    <main class="container">
        <section class="form-card shadow-sm mx-auto p-4 p-md-5">
      <div class="form-card__header mb-4 border-bottom pb-3">
        <h2 id="formTitle" class="fw-bold" style="color: var(--color-text-main);">Perfil de adopción</h4>
        <p class="text-muted">Información General</p>
      </div>

      <form id="adopcion-form" novalidate>

        <div class="form-section">
          <h4 class="form-section__title text-success mb-3 fw-bold"><i class="bi bi-info-circle me-2"></i>Información General</h2>

          <div class="form-grid row g-3">

            <div class="form-field col-md-6" data-field="nombre">
              <label class="form-label fw-bold" for="nombre-mascota">Nombre</label>
              <input type="text" class="form-control" id="nombre-mascota" name="nombre" placeholder="Ej. Firulais" required />
              <span class="field-error"></span>
            </div>

            <div class="form-field col-md-6" data-field="imagen">
              <label class="form-label fw-bold" for="imagen-mascota">Imagen</label>
              <div class="image-upload d-flex flex-column gap-2">
                <label class="form-label fw-bold" class="image-upload__trigger" for="imagen-mascota">+ Agregar Imagen</label>
                <input type="file" id="imagen-mascota" name="imagen" accept="image/*" />
                <div class="image-upload__preview" id="imagen-preview">Sin imagen</div>
              </div>
            </div>

            <div class="form-field col-12" data-field="descripcion">
              <label class="form-label fw-bold" for="descripcion-mascota">Descripción General</label>
              <textarea class="form-control" id="descripcion-mascota" name="descripcion" placeholder="Cuéntanos sobre esta mascota..."></textarea>
            </div>

            <div class="form-field col-md-6" data-field="edad">
              <label class="form-label fw-bold" for="edad">Edad</label>
              <input type="text" class="form-control" id="edad" name="edad" placeholder="Ej. 2 años" />
            </div>

            <div class="form-field col-md-6" data-field="vacunado">
              <label class="form-label fw-bold" for="vacunado">Vacunado</label>
              <select class="form-select" id="vacunado" name="vacunado">
                <option value="">Seleccione respuesta</option>
                <option value="si">Sí</option>
                <option value="no">No</option>
              </select>
            </div>

            <div class="form-field col-md-6" data-field="enfermedad">
              <label class="form-label fw-bold" for="enfermedad">Alguna Enfermedad</label>
              <select class="form-select" id="enfermedad" name="enfermedad">
                <option value="">Seleccione respuesta</option>
                <option value="ninguna">Ninguna</option>
                <option value="si">Sí</option>
              </select>
            </div>

            <div class="form-field col-md-6" data-field="id">
              <label class="form-label fw-bold" for="id-mascota">ID</label>
              <input type="text" class="form-control" id="id-mascota" name="id" placeholder="Ej. ADP-0001" required />
              <span class="field-error"></span>
            </div>

            <div class="form-field col-md-6" data-field="refugio">
              <label class="form-label fw-bold" for="refugio">Lugar de refugio</label>
              <input type="text" class="form-control" id="refugio" name="refugio" placeholder="Ej. Refugio Patitas Felices" />
            </div>

          </div>
        </div>

        <!-- ---------- Botones de acción ---------- -->
        
        <div class="form-actions d-flex gap-3 mt-4">
          <a href="../community/adpciones.html" class="btn btn-outline-secondary w-50 py-3 fw-bold fs-5">Cancelar</a>
          <button type="submit" class="btn btn-success w-50 py-3 fw-bold fs-5" style="background:#1f6b3d; border:none;"><i class="bi bi-save me-2"></i>Guardar Cambios</button>
        </div>


      </form>
    </section>
    </main>

    <!-- TOAST DECORATIVO -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastExito" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <i class="bi bi-check-circle-fill me-2"></i> Producto guardado correctamente.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Contenedor del Footer -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../scripts/core/layout.js"></script>
    
    <!-- Script de Admin -->
    <script src="../../scripts/shop/adminForms.js"></script>
    <script src="../../scripts/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formCard = document.querySelector('.form-card');
            if (formCard) {
                setTimeout(() => {
                    formCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }
        });
    </script>
</body>
</html>
