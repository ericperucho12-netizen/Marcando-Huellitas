<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Historias - Marcando Huellitas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/styles.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <div data-template="../../layout/navbar.html" data-root="../../.." data-src="../.."></div>

    <!-- MAIN CONTAINER -->
    <div class="container py-5 mt-5">
        <div class="mb-4">
            <a href="historias.html" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-2"></i>Volver a Historias</a>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: var(--color-text-main);">Gestión de Historias de Adopción</h2>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Usuario</th>
                                <th scope="col">Mascota</th>
                                <th scope="col">Historia</th>
                                <th scope="col">Estado</th>
                                <th scope="col" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistoriasBody">
                            <!-- Las historias se inyectarán aquí dinámicamente -->
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Cargando historias...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Ver Historia -->
    <div class="modal fade" id="verHistoriaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTituloHistoria">Historia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalContenidoHistoria" style="white-space: pre-wrap;"></p>
                    <div class="text-center mt-3">
                        <img id="modalImagenHistoria" src="" alt="Imagen de la historia" class="img-fluid rounded shadow-sm d-none" style="max-height: 300px;">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

        <!-- Modal Editar Historia -->
    <div class="modal fade" id="editarHistoriaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Historia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarHistoria">
                        <input type="hidden" id="editHistoriaId">
                        <div class="mb-3">
                            <label for="editTitulo" class="form-label">Mascota (Título)</label>
                            <input type="text" class="form-control" id="editTitulo" required>
                        </div>
                        <div class="mb-3">
                            <label for="editContenido" class="form-label">Historia</label>
                            <textarea class="form-control" id="editContenido" rows="5" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editImagen" class="form-label">URL de Imagen</label>
                            <input type="url" class="form-control" id="editImagen">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarEdicion()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div data-template="../../layout/footer.html" data-root="../../.." data-src="../.."></div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom Scripts -->
    <script src="../../scripts/main.js"></script>
    <script src="../../scripts/community/admin-historias.js"></script>
</body>
</html>
