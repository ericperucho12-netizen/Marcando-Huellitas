<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Marcando Huellitas</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

    <!-- Contenedor del Navbar -->
    <div data-template="../layout/navbar.html" data-root="../.." data-src=".."></div>

    <!-- SECCIÓN DE INICIO DE SESIÓN -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-5">
                    <div class="card shadow-sm border-0 p-4 rounded-3">
                        
                        <h2 class="text-center mb-4">Iniciar Sesión</h2>

                        <form id="loginForm" novalidate>
                            <!-- Usuario o Correo -->
                            <div class="mb-3">
                                <label for="userOrEmail" class="form-label">Nombre de usuario o correo electrónico</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control" id="userOrEmail" placeholder="usuario o correo@ejemplo.com" required>
                                    <div class="invalid-feedback">
                                        Ingresa tu nombre de usuario o un correo electrónico válido.
                                    </div>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="password" aria-label="Mostrar u ocultar contraseña">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                    <div class="invalid-feedback">
                                        Ingresa tu contraseña.
                                    </div>
                                </div>
                            </div>

                            <!-- Botón Entrar -->
                            <div id="alertContainer"></div>
                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
                            </div>
                        </form>

                        <!-- Botón/Enlace a Registro -->
                        <div class="text-center pt-3 border-top">
                            <p class="mb-2 text-muted">¿Aún no tienes cuenta?</p>
                            <a href="registrousuarios.html" class="btn btn-outline-primary w-100">Crear cuenta</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Contenedor del Footer -->
    <div data-template="../layout/footer.html" data-root="../.." data-src=".."></div>

    <!-- Layout JS -->
    <script src="../scripts/layout.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Archivo JS de validación de login -->
    <script src="../scripts/login.js"></script>
</body>

</html>
