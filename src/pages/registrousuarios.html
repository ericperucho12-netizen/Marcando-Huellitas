<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Marcando Huellitas</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

    <!-- Contenedor del Navbar -->
    <div data-template="../layout/navbar.html" data-root="../.." data-src=".."></div>

    <!-- SECCIÓN DE REGISTRO DE USUARIO -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            
                            <h2 class="text-center fw-bold mb-4" style="color: #2b2b2b;">
                                Registro de Usuario
                            </h2>

                            <form id="registerForm" novalidate>
                                <!-- 1. Nombre completo -->
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre completo:</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
                                    <div class="invalid-feedback">
                                        Por favor ingresa tu nombre completo.
                                    </div>
                                </div>

                                <!-- 2. Número de teléfono -->
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">Número de teléfono:</label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="5512345678" required>
                                    <div class="invalid-feedback">
                                        Ingresa un número de teléfono válido.
                                    </div>
                                </div>

                                <!-- 3. Email (nombre de usuario) -->
                                <div class="mb-3">
                                    <label for="email" class="form-label">Correo electrónico:</label>
                                    <input type="email" class="form-control" id="email" name="email" aria-describedby="emailHelp" placeholder="correo@ejemplo.com" required>
                                    <div id="emailHelp" class="form-text">No compartiremos tu correo electrónico con nadie más.</div>
                                    <div class="invalid-feedback">
                                        Ingresa un correo electrónico válido.
                                    </div>
                                </div>

                                <!-- 4. Contraseña -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                    <div class="invalid-feedback">
                                        Por favor ingresa una contraseña.
                                    </div>
                                </div>

                                <!-- 5. Confirmar Contraseña (Validación) -->
                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                                    <div class="invalid-feedback">
                                        Las contraseñas deben coincidir.
                                    </div>
                                </div>

                                <!-- Botón de envío -->
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                    Registrarse
                                </button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contenedor del Footer -->
    <div data-template="../layout/footer.html" data-root="../.." data-src=".."></div>

    <!-- Layout JS -->
    <script src="../scripts/layout.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo JS con la validación personalizada -->
    <script src="app.js"></script>
</body>

</html>
